name: Field Guide QA
on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - name: Install Jekyll
        run: gem install jekyll minima
      - name: Build exact branch
        run: jekyll build --destination _site
      - name: Validate referenced images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          html='\n'.join(p.read_text(errors='ignore') for p in Path('_site').rglob('*.html'))
          srcs=re.findall(r'<img[^>]+src=["\']([^"\']+)',html)
          missing=[]
          for src in srcs:
              if src.startswith(('http://','https://','data:')): continue
              rel=src.split('?',1)[0].split('#',1)[0].lstrip('/')
              p=Path('_site')/rel
              if not p.exists(): missing.append(src)
          print('images:', len(srcs), 'missing:', missing)
          if missing: sys.exit(1)
          PY
      - name: Check current UI image signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          bad=[]
          for p in Path('_site/img/current-ui').glob('*.webp'):
              b=p.read_bytes()
              ok=len(b)>=12 and b[:4]==b'RIFF' and b[8:12]==b'WEBP'
              print(p, len(b), 'OK' if ok else 'BAD')
              if not ok: bad.append(str(p))
          if bad: sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: field-guide-qa-site
          path: _site
