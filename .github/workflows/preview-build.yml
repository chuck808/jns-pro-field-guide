name: Field Guide Preview Build

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Restore hardware renders
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          base64 -d img/hardware/JNS_Pro.b64 > img/hardware/JNS_Pro.jpg
          base64 -d img/hardware/JNS_Lights.b64 > img/hardware/JNS_Lights.jpg
          base64 -d img/hardware/JNS_Timer.b64 > img/hardware/JNS_Timer.jpg
          rm img/hardware/JNS_Pro.b64 img/hardware/JNS_Lights.b64 img/hardware/JNS_Timer.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/hardware
          if ! git diff --cached --quiet; then
            git commit -m "Restore hardware render binaries"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: field-guide-preview
          path: ./_site
          if-no-files-found: error
